services:

  grafica-1:
    build: .
    container_name: secop-grafica-1
    restart: "no"
    command: python scripts/pregunta_1.py
    depends_on:
      - dask-scheduler
      - dask-worker-1
      - dask-worker-2
      - dask-worker-3
    volumes:
      - datos:/datos
      - ./graficas:/output
    networks:
      - dask-net

