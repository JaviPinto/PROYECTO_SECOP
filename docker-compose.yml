  grafica-10:
    build: .
    container_name: secop-grafica-10
    restart: "no"
    command: python scripts/pregunta_10.py
    depends_on:
      - dask-scheduler
      - dask-worker-1
      - dask-worker-2
      - dask-worker-3
    volumes:
      - datos:/datos
      - ./graficas:/output
    networks:
      - dask-net

  dask-scheduler:
    image: ghcr.io/dask/dask:latest
    container_name: dask-scheduler
    command: dask scheduler
    ports:
      - "8786:8786"   # puerto del scheduler (workers y app se conectan aquí)
      - "8787:8787"   # dashboard web → abrir en http://localhost:8787
    volumes:
      - datos:/datos
    networks:
      - dask-net

  dask-worker-1:
    image: ghcr.io/dask/dask:latest
    container_name: dask-worker-1
    command: dask worker tcp://dask-scheduler:8786 --nthreads 2 --memory-limit 5GB
    depends_on:
      - dask-scheduler
    volumes:
      - datos:/datos
    networks:
      - dask-net

  dask-worker-2:
    image: ghcr.io/dask/dask:latest
    container_name: dask-worker-2
    command: dask worker tcp://dask-scheduler:8786 --nthreads 2 --memory-limit 5GB
    depends_on:
      - dask-scheduler
    volumes:
      - datos:/datos
    networks:
      - dask-net

  dask-worker-3:
    image: ghcr.io/dask/dask:latest
    container_name: dask-worker-3
    command: dask worker tcp://dask-scheduler:8786 --nthreads 2 --memory-limit 5GB
    depends_on:
      - dask-scheduler
    volumes:
      - datos:/datos
    networks:
      - dask-net

  app:
    build: .
    container_name: secop-app
    command: python pipeline.py
    depends_on:
      - dask-scheduler
      - dask-worker-1
      - dask-worker-2
      - dask-worker-3
    volumes:
      - datos:/datos
    networks:
      - dask-net

volumes:
  datos:

networks:
  dask-net:
    driver: bridge


